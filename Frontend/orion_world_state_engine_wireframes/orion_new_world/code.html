<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Orion - Create World</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Source+Serif+4:wght@100..900&family=Space+Grotesk:wght@100..900&display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "background": "#131315",
                        "primary-fixed-dim": "#feb68d",
                        "inverse-surface": "#e5e1e4",
                        "starlight-white": "#FAFAFA",
                        "surface-variant": "#353437",
                        "on-primary": "#502406",
                        "on-secondary-fixed": "#171b27",
                        "on-primary-container": "#522608",
                        "error-container": "#93000a",
                        "copper-glow": "#E6A27E",
                        "tertiary-container": "#9b9999",
                        "secondary-fixed": "#dee2f2",
                        "surface": "#131315",
                        "on-secondary-fixed-variant": "#424754",
                        "outline": "#9f8d84",
                        "surface-container": "#201f22",
                        "secondary": "#c2c6d6",
                        "error": "#ffb4ab",
                        "inverse-primary": "#875130",
                        "surface-container-lowest": "#0e0e10",
                        "void-black": "#000000",
                        "secondary-container": "#424754",
                        "on-secondary-container": "#b0b5c4",
                        "surface-container-low": "#1c1b1d",
                        "surface-container-high": "#2a2a2c",
                        "tertiary-fixed": "#e5e2e1",
                        "surface-tint": "#feb68d",
                        "on-primary-fixed": "#321200",
                        "on-secondary": "#2b303c",
                        "outline-variant": "#52443c",
                        "on-error": "#690005",
                        "primary": "#feb68d",
                        "surface-container-highest": "#353437",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-fixed": "#1b1b1b",
                        "secondary-fixed-dim": "#c2c6d6",
                        "deep-charcoal": "#121212",
                        "on-background": "#e5e1e4",
                        "primary-fixed": "#ffdbc9",
                        "inverse-on-surface": "#313032",
                        "surface-dim": "#131315",
                        "on-surface": "#e5e1e4",
                        "tertiary": "#c8c6c5",
                        "on-primary-fixed-variant": "#6b3a1b",
                        "tertiary-fixed-dim": "#c8c6c5",
                        "on-tertiary": "#303030",
                        "surface-bright": "#39393b",
                        "primary-container": "#cc8b65",
                        "on-tertiary-fixed-variant": "#474746",
                        "on-surface-variant": "#d7c2b8",
                        "on-tertiary-container": "#323131"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-md": "16px",
                        "nav-rail-width": "64px",
                        "stack-sm": "8px",
                        "gutter": "24px",
                        "side-panel-width": "320px",
                        "margin-safe": "40px",
                        "stack-lg": "32px"
                    },
                    "fontFamily": {
                        "headline-md": ["\"Source Serif 4\""],
                        "display-lg": ["\"Source Serif 4\""],
                        "label-sm": ["Space Grotesk"],
                        "headline-lg-mobile": ["\"Source Serif 4\""],
                        "headline-lg": ["\"Source Serif 4\""],
                        "body-lg": ["Geist"],
                        "body-md": ["Geist"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "300" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-void-black text-on-background min-h-screen font-body-md selection:bg-primary/30 selection:text-primary-fixed flex items-center justify-center overflow-hidden">
<!-- Background Texture -->
<div class="fixed inset-0 pointer-events-none opacity-5 mix-blend-overlay z-0" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');"></div>
<main class="relative z-10 w-full max-w-4xl px-gutter md:px-margin-safe py-12 flex flex-col items-center">
<header class="text-center mb-stack-lg max-w-2xl mx-auto">
<h1 class="font-headline-lg text-headline-lg md:font-display-lg md:text-display-lg text-starlight-white mb-stack-sm tracking-tight">Create World</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-lg mx-auto">Bring what you already have. You don't have to build your world from zero.</p>
</header>
<div class="w-full grid grid-cols-1 md:grid-cols-3 gap-6">
<!-- Option 1: Import Manuscript -->
<button class="group flex flex-col items-center text-center p-8 rounded-xl bg-surface-container-low border border-outline-variant/30 hover:border-primary/50 transition-all duration-300 relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-b from-primary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
<div class="w-16 h-16 rounded-full bg-surface-container-high flex items-center justify-center mb-6 group-hover:bg-primary/10 transition-colors duration-300 border border-outline-variant/50 group-hover:border-primary/30">
<span class="material-symbols-outlined text-3xl text-on-surface group-hover:text-primary transition-colors" data-icon="menu_book" style="font-variation-settings: 'wght' 200;">menu_book</span>
</div>
<h3 class="font-headline-md text-headline-md text-starlight-white mb-2">Import a Manuscript</h3>
<p class="font-body-md text-body-md text-on-surface-variant/80">Start by extracting lore and entities directly from your text.</p>
</button>
<!-- Option 2: Import Material -->
<button class="group flex flex-col items-center text-center p-8 rounded-xl bg-surface-container-low border border-primary/40 shadow-[0_0_40px_rgba(254,182,141,0.05)] hover:border-primary transition-all duration-300 relative overflow-hidden transform md:-translate-y-4">
<div class="absolute inset-0 bg-gradient-to-b from-primary/10 to-transparent opacity-100 transition-opacity duration-500"></div>
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-1/3 h-px bg-gradient-to-r from-transparent via-primary to-transparent opacity-50"></div>
<div class="w-16 h-16 rounded-full bg-primary/10 flex items-center justify-center mb-6 border border-primary/30 group-hover:bg-primary/20 transition-colors">
<span class="material-symbols-outlined text-3xl text-primary" data-icon="folder_zip" style="font-variation-settings: 'wght' 200;">folder_zip</span>
</div>
<h3 class="font-headline-md text-headline-md text-starlight-white mb-2">Import World Material</h3>
<p class="font-body-md text-body-md text-on-surface-variant/80">Bring in your notes, maps, and existing encyclopedias.</p>
<div class="mt-6 flex gap-3 text-on-surface-variant/50">
<span class="font-label-sm text-label-sm border border-outline-variant/30 px-2 py-1 rounded bg-surface-container">TXT</span>
<span class="font-label-sm text-label-sm border border-outline-variant/30 px-2 py-1 rounded bg-surface-container">PDF</span>
<span class="font-label-sm text-label-sm border border-outline-variant/30 px-2 py-1 rounded bg-surface-container">EPUB</span>
<span class="material-symbols-outlined text-lg" data-icon="image">image</span>
</div>
</button>
<!-- Option 3: Scratch -->
<button class="group flex flex-col items-center text-center p-8 rounded-xl bg-surface-container-low border border-outline-variant/30 hover:border-outline transition-all duration-300 relative overflow-hidden">
<div class="w-16 h-16 rounded-full bg-surface-container-high flex items-center justify-center mb-6 group-hover:bg-surface-container-highest transition-colors duration-300 border border-outline-variant/50">
<span class="material-symbols-outlined text-3xl text-on-surface-variant" data-icon="add" style="font-variation-settings: 'wght' 200;">add</span>
</div>
<h3 class="font-headline-md text-headline-md text-starlight-white mb-2">Start from Scratch</h3>
<p class="font-body-md text-body-md text-on-surface-variant/80">Begin with a blank canvas and build entity by entity.</p>
</button>
</div>
<!-- Drag and Drop Area -->
<div class="w-full mt-12 p-12 border border-dashed border-outline-variant/50 rounded-xl bg-surface-container-lowest/50 flex flex-col items-center justify-center transition-colors hover:bg-surface-container-low/50 hover:border-primary/50 group cursor-pointer relative overflow-hidden">
<div class="absolute inset-0 bg-primary/5 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></div>
<span class="material-symbols-outlined text-4xl text-outline mb-4 group-hover:text-primary transition-colors" data-icon="upload_file" style="font-variation-settings: 'wght' 200;">upload_file</span>
<p class="font-body-lg text-body-lg text-starlight-white mb-1">Drag and drop your files here</p>
<p class="font-body-md text-body-md text-on-surface-variant/60">or click to browse from your computer</p>
</div>
</main>
</body></html>
