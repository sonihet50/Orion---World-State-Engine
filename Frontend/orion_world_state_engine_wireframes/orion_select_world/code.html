<style>
        body {
            background-color: #000000; /* The Void */
            color: #e5e1e4;
            margin: 0;
            overflow-x: hidden;
        }
        
        .book-cover-hover {
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        
        .book-cover-hover:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.8), 0 0 40px 0 rgba(230, 162, 126, 0.05); /* Soft copper glow */
            border-color: rgba(250, 250, 250, 0.2);
        }
        
        .book-cover-hover::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 50%, rgba(230, 162, 126, 0.08) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            z-index: 10;
        }
        
        .book-cover-hover:hover::after {
            opacity: 1;
        }

        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vh;
            background: radial-gradient(circle, rgba(230, 162, 126, 0.03) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
        }
    </style>
