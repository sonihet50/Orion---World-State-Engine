<style>
        body {
            background-color: theme('colors.void-black');
            background-image: radial-gradient(circle at 50% 0%, rgba(230, 162, 126, 0.03) 0%, transparent 70%);
        }
        
        /* Thin line icon style */
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 0,
          'wght' 200,
          'GRAD' 0,
          'opsz' 24;
        }

        .input-underline {
            background: transparent;
            border: none;
            border-bottom: 1px solid theme('colors.surface-container-highest');
            border-radius: 0;
            padding: 12px 0;
            transition: border-color 0.3s ease;
        }
        
        .input-underline:focus {
            outline: none;
            box-shadow: none;
            border-bottom-color: theme('colors.copper-glow');
        }
        
        .btn-ghost {
            border: 1px solid theme('colors.copper-glow');
            color: theme('colors.copper-glow');
            transition: all 0.3s ease;
        }
        
        .btn-ghost:hover {
            background-color: theme('colors.copper-glow');
            color: theme('colors.void-black');
        }
        
        .btn-text {
            color: theme('colors.on-surface-variant');
            transition: color 0.3s ease;
        }
        
        .btn-text:hover {
            color: theme('colors.starlight-white');
        }
    </style>

<body class="min-h-screen flex items-center justify-center text-on-surface antialiased selection:bg-copper-glow/30 selection:text-starlight-white">
<div class="w-full max-w-md px-gutter relative z-10">
<!-- Tonal Layering / Floating Panel -->
<div class="bg-surface-container-low/95 backdrop-blur-xl border border-starlight-white/10 rounded-xl p-8 shadow-2xl relative overflow-hidden group">
<!-- Subtle Hover Glow Effect via pseudo-element -->
<div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_-20%,rgba(230,162,126,0.08),transparent_70%)] opacity-0 group-hover:opacity-100 transition-opacity duration-700 pointer-events-none"></div>
<!-- Logo Section -->
<div class="flex flex-col items-center justify-center mb-stack-lg relative z-10">
<div class="w-16 h-16 rounded-full border border-starlight-white/5 flex items-center justify-center mb-stack-sm bg-surface-container/50">
<span class="material-symbols-outlined text-[32px] text-copper-glow" style="font-variation-settings: 'wght' 100;">bubble_chart</span>
</div>
<h2 class="font-headline-md text-headline-md text-primary tracking-tighter">Orion</h2>
</div>
<!-- Header -->
<div class="text-center mb-stack-lg relative z-10">
<h1 class="font-display-lg text-display-lg text-starlight-white mb-2 hidden md:block">Enter the Archive</h1>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-starlight-white mb-2 md:hidden">Enter the Archive</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Your sanctuary for world-building awaits.</p>
</div>
<!-- Form -->
<form class="space-y-stack-md relative z-10" onsubmit="event.preventDefault();">
<div class="flex flex-col">
<label class="sr-only" for="email">Email Address</label>
<input class="input-underline font-body-md text-body-md text-starlight-white placeholder:text-surface-container-highest w-full" id="email" name="email" placeholder="Email Address" required="" type="email"/>
</div>
<div class="flex flex-col">
<label class="sr-only" for="password">Password</label>
<input class="input-underline font-body-md text-body-md text-starlight-white placeholder:text-surface-container-highest w-full" id="password" name="password" placeholder="Password" required="" type="password"/>
</div>
<div class="pt-stack-sm flex items-center justify-between">
<button class="btn-text font-label-sm text-label-sm uppercase tracking-widest" type="button">Forgot Password?</button>
</div>
<div class="pt-stack-md">
<button class="btn-ghost w-full py-3 rounded uppercase font-label-sm text-label-sm tracking-widest flex items-center justify-center gap-2" type="submit">
<span>Unlock</span>
<span class="material-symbols-outlined text-[18px]">key</span>
</button>
</div>
</form>
<!-- Social Login Divider -->
<div class="mt-stack-lg relative z-10">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-starlight-white/5"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface-container-low text-on-surface-variant font-label-sm text-label-sm uppercase">Or access via</span>
</div>
</div>
<!-- Social Login Buttons -->
<div class="mt-stack-md flex justify-center gap-4 relative z-10">
<button class="w-12 h-12 rounded-full border border-starlight-white/10 flex items-center justify-center text-on-surface-variant hover:text-starlight-white hover:border-starlight-white/30 transition-colors bg-surface-container-lowest/50" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 200;">fingerprint</span>
</button>
<button class="w-12 h-12 rounded-full border border-starlight-white/10 flex items-center justify-center text-on-surface-variant hover:text-starlight-white hover:border-starlight-white/30 transition-colors bg-surface-container-lowest/50" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 200;">public</span>
</button>
</div>
<div class="mt-stack-lg text-center relative z-10">
<p class="font-body-md text-body-md text-on-surface-variant">
                    New to the Archive? <button class="text-copper-glow hover:text-primary-fixed transition-colors ml-1">Forge an entry</button>
</p>
</div>
</div>
</div>
<!-- Background atmospheric elements -->
<div class="fixed inset-0 pointer-events-none z-0">
<div class="absolute top-0 right-0 w-1/2 h-1/2 bg-[radial-gradient(ellipse_at_top_right,rgba(230,162,126,0.02),transparent_70%)]"></div>
<div class="absolute bottom-0 left-0 w-1/2 h-1/2 bg-[radial-gradient(ellipse_at_bottom_left,rgba(254,182,141,0.01),transparent_70%)]"></div>
</div>
